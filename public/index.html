<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marketluz videollamada</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      text-align: center;
    }

    h2 {
      padding: 15px;
    }

    /* CONTENEDOR DE VIDEOS */
    .videos {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      flex-wrap: wrap;
    }

    /* CADA VIDEO */
    video {
      width: 300px;
      height: 500px; /* vertical */
      object-fit: cover;
      border-radius: 20px; /* ovalados */
      background: black;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    
    @media (max-width: 768px) {
      video {
        width: 90%;
        height: 400px;
      }
    }
  </style>
</head>

<body>

  <h2>🎥 Marketluz videollamada</h2>

  <div class="videos">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>

</body>
</html>
